# Root logger option
log4j.rootLogger=DEBUG, stdout

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%m%n

# Loggers by class; writes to an individual file
log4j.logger.pt.ptinovacao.naportal.catalog=DEBUG, CatalogTemplateTransformer
log4j.category.ExceptionClient=DEBUG, CatalogTemplateTransformerExceptions

# setup ConsoleAppender (root log)
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

# setup catalog template transformer log
log4j.appender.CatalogTemplateTransformer=org.apache.log4j.DailyRollingFileAppender
log4j.appender.CatalogTemplateTransformer.File=/var/log/alticelabs/na-portal/catalog-template-translator/catalog-template-transformer.log
log4j.appender.CatalogTemplateTransformer.Append=true
log4j.appender.CatalogTemplateTransformer.DatePattern = '.'yyyy-MM-dd
log4j.appender.CatalogTemplateTransformer.layout=org.apache.log4j.PatternLayout
log4j.appender.CatalogTemplateTransformer.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

# setup catalog template transformer Exceptions log
log4j.appender.CatalogTemplateTransformerExceptions=org.apache.log4j.DailyRollingFileAppender
log4j.appender.CatalogTemplateTransformerExceptions.File=/var/log/alticelabs/na-portal/catalog-template-translator/catalog-template-transformer.log
log4j.appender.CatalogTemplateTransformerExceptions.Append=true
log4j.appender.CatalogTemplateTransformerExceptions.DatePattern = '.'yyyy-MM-dd
log4j.appender.CatalogTemplateTransformerExceptions.layout=org.apache.log4j.PatternLayout
log4j.appender.CatalogTemplateTransformerExceptions.layout.ConversionPattern=%d [%t] %-5p %c - %m%n